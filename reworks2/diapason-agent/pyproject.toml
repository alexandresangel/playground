[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diapason-pascal"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "openai>=1.42.0",
  "httpx>=0.27.0",
  "pyjwt>=2.8.0",
  "cryptography>=42.0.0",
  "azure-storage-blob>=12.19.0",
  "azure-identity>=1.15.0",
  "pypdf>=6.16.1",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-logging",
  "langgraph>=1.0,<2",
  "langsmith>=0.1.95,<1"
]

[tool.setuptools]
include-package-data = false
packages = ["dia_jwt", "locales", "pascal", "pascal.agent", "pascal.api", "pascal.compat", "pascal.compat.capture", "pascal.observability"]
py-modules = ["auth_setup", "blob_client", "build_info", "i18n", "mcp_context", "mcp_rpc", "prompt_loader", "session_store", "settings", "source_extract", "telemetry", "tool_audience"]

[tool.setuptools.package-dir]
"" = "src/pascal/company"
pascal = "src/pascal"

[tool.setuptools.package-data]
locales = ["*.json"]
dia_jwt = ["README.md"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/pascal/company"]
