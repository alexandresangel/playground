name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.0
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check src tests scripts
      - run: uv run --locked --extra dev ruff format --check src tests scripts
      - run: uv run --locked --extra dev mypy
      - run: uv run --locked --extra dev pytest --junitxml=pytest-report.xml
      - run: uv pip check
      - run: uv run --locked --extra dev python scripts/validate_artifacts.py
      - run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}
          path: pytest-report.xml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: node --check frontend/src/chat-app.js
  container:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t pascal:test-suite .
      - run: docker build --build-arg GIT_REVISION="$GITHUB_SHA" -t pascal:test .
      - run: docker run --rm --network none --mount "type=bind,source=$PWD/scripts,target=/checks,readonly" --entrypoint python pascal:test /checks/container_check.py
