[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-capture"
version = "0.1.11"
description = "Extraction service as LangGraph workflow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "openai>=1.42.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "pypdf>=6.16.1",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-logging",
    "langgraph>=1.2.4,<2",
    # "langsmith",
    # "starlette",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools]
packages = ["capture", "capture.api", "capture.observability", "capture.workflow", "dia_jwt", "locales"]
py-modules = ["auth_setup", "build_info", "i18n", "mcp_context", "mcp_rpc", "settings", "telemetry"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src/capture/common"
"capture" = "src/capture"
"dia_jwt" = "src/capture/common/dia_jwt"
"locales" = "src/capture/common/locales"

[tool.setuptools.package-data]
locales = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"