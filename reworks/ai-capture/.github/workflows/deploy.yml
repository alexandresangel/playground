# Deploy to ACA (m2m / ai-diapason-mcp style): unit tests in ci.yml; manual dev builds, staging/prod promotion.
#
# Terraform owns the ACA shell (apps/ai/ai-capture). This workflow builds/pushes and rolls the revision.
# Capture catalog and prompts are baked into the image (no separate config blob upload).
#
# - workflow_dispatch + environment=dev  → build & push IMAGE_TAG=github.sha, deploy + smoke to ACA dev
# - workflow_dispatch + environment=staging → promote IMAGE_TAG (required; SHA from a successful dev deploy)
# - release published (not draft)            → promote github.sha to prod
#
# GitHub Environments: dev | staging | prod (Azure + Infisical). Smoke needs SMOKE_API_CONFIG
# in Infisical /ai-capture (m2m Bearer with scope ai-capture).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
        default: dev
      image_tag:
        description: Registry image tag to promote (git SHA). Required for staging; ignored for dev.
        required: false
        type: string
  release:
    types: [published]

permissions: {}

env:
  GITHUB_REGISTRY: containers.diapason.ghe.com

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    environment: ${{ github.event_name == 'release' && 'prod' || inputs.environment }}
    steps:
      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == release ]]; then
            if [[ "$RELEASE_DRAFT" == true ]]; then
              echo "error: draft releases do not deploy" >&2
              exit 1
            fi
            echo "env=prod" >>"$GITHUB_OUTPUT"
            echo "image_tag=$GIT_SHA" >>"$GITHUB_OUTPUT"
            echo "skip_build=1" >>"$GITHUB_OUTPUT"
            echo "checkout_ref=$GIT_SHA" >>"$GITHUB_OUTPUT"
          elif [[ "$INPUT_ENVIRONMENT" == staging ]]; then
            tag="$INPUT_IMAGE_TAG"
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            if [[ -z "$tag" ]]; then
              echo "error: image_tag is required when deploying to staging (use the git SHA from a successful dev deploy)" >&2
              exit 1
            fi
            echo "env=staging" >>"$GITHUB_OUTPUT"
            echo "image_tag=$tag" >>"$GITHUB_OUTPUT"
            echo "skip_build=1" >>"$GITHUB_OUTPUT"
            echo "checkout_ref=$tag" >>"$GITHUB_OUTPUT"
          else
            echo "env=dev" >>"$GITHUB_OUTPUT"
            echo "image_tag=$GIT_SHA" >>"$GITHUB_OUTPUT"
            echo "skip_build=0" >>"$GITHUB_OUTPUT"
            echo "checkout_ref=$GIT_SHA" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up uv and Python for smoke checks
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"

      - uses: diapason/actions/service-deploy/login-azure@main
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          DEPLOY_ENV: ${{ steps.target.outputs.env }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
          SKIP_BUILD: ${{ steps.target.outputs.skip_build }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REGISTRY: ${{ env.GITHUB_REGISTRY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: bash deploy/deploy.sh "$DEPLOY_ENV"

      - uses: diapason/actions/service-deploy/logout-azure@main
        if: always()
