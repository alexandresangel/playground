# Deploy to ACA: offline tests before deployment; merge to main builds & rolls dev.
#
# Terraform owns the ACA shell (apps/ai/ai-capture). This workflow builds/pushes and rolls the revision.
# Capture catalog and prompts are baked into the image (no separate config blob upload).
#
# - workflow_dispatch + environment=dev  → build & push IMAGE_TAG=github.sha, deploy + smoke to ACA dev
# - workflow_dispatch + environment=staging → promote IMAGE_TAG (required; SHA from a successful dev deploy)
# - release published (not draft)            → promote github.sha to prod
#
# GitHub Environments: dev | staging | prod (Azure + Infisical).
# Deploy smoke = /health only. Post-deploy integ (tests/test_integ.py) runs only when
# Environment variable INTEG_AFTER_DEPLOY=true (else skip; Integ Action still
# runnable via workflow_dispatch). Needs INTEG_PLATFORM_CONFIG + INTEG_APP_CONFIG.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
        default: dev
      image_tag:
        description: Registry image tag to promote (git SHA). Required for staging; ignored for dev.
        required: false
        type: string
  release:
    types: [published]

permissions: {}

env:
  GITHUB_REGISTRY: containers.diapason.ghe.com

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'prod' || github.event_name == 'push' && 'dev' || inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    environment: ${{ github.event_name == 'release' && 'prod' || github.event_name == 'push' && 'dev' || inputs.environment }}
    outputs:
      env: ${{ steps.target.outputs.env }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
      run_integ: ${{ steps.integ_gate.outputs.run_integ }}
    steps:
      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == release ]]; then
            if [[ "$RELEASE_DRAFT" == true ]]; then
              echo "error: draft releases do not deploy" >&2
              exit 1
            fi
            echo "env=prod" >>"$GITHUB_OUTPUT"
            echo "image_tag=$GIT_SHA" >>"$GITHUB_OUTPUT"
            echo "skip_build=1" >>"$GITHUB_OUTPUT"
            echo "checkout_ref=$GIT_SHA" >>"$GITHUB_OUTPUT"
            echo "release_tag=$RELEASE_TAG_NAME" >>"$GITHUB_OUTPUT"
          elif [[ "$INPUT_ENVIRONMENT" == staging ]]; then
            tag="$INPUT_IMAGE_TAG"
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            if [[ -z "$tag" ]]; then
              echo "error: image_tag is required when deploying to staging (use the git SHA from a successful dev deploy)" >&2
              exit 1
            fi
            echo "env=staging" >>"$GITHUB_OUTPUT"
            echo "image_tag=$tag" >>"$GITHUB_OUTPUT"
            echo "skip_build=1" >>"$GITHUB_OUTPUT"
            echo "checkout_ref=$tag" >>"$GITHUB_OUTPUT"
          else
            echo "env=dev" >>"$GITHUB_OUTPUT"
            echo "image_tag=$GIT_SHA" >>"$GITHUB_OUTPUT"
            echo "skip_build=0" >>"$GITHUB_OUTPUT"
            echo "checkout_ref=$GIT_SHA" >>"$GITHUB_OUTPUT"
          fi

      - name: Gate post-deploy integ
        id: integ_gate
        env:
          INTEG_AFTER_DEPLOY: ${{ vars.INTEG_AFTER_DEPLOY }}
        run: |
          set -euo pipefail
          v="$(printf '%s' "${INTEG_AFTER_DEPLOY:-}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$v" == "true" ]]; then
            echo "run_integ=true" >>"$GITHUB_OUTPUT"
            echo "INTEG_AFTER_DEPLOY=true → will run integ after deploy"
          else
            echo "run_integ=false" >>"$GITHUB_OUTPUT"
            echo "INTEG_AFTER_DEPLOY=${INTEG_AFTER_DEPLOY:-∅} → smoke only (/health); skip integ"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"

      - name: Offline tests before deployment
        run: |
          uv sync --locked --group dev
          uv run --locked --no-sync python -m pytest -v

      - uses: diapason/actions/service-deploy/login-azure@main
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          DEPLOY_ENV: ${{ steps.target.outputs.env }}
          IMAGE_TAG: ${{ steps.target.outputs.image_tag }}
          SKIP_BUILD: ${{ steps.target.outputs.skip_build }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REGISTRY: ${{ env.GITHUB_REGISTRY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: bash deploy/deploy.sh "$DEPLOY_ENV"

      - uses: diapason/actions/service-deploy/logout-azure@main
        if: always()

  integ:
    needs: deploy
    if: needs.deploy.outputs.run_integ == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/integ.yml
    with:
      environment: ${{ needs.deploy.outputs.env }}
      image_tag: ${{ needs.deploy.outputs.image_tag }}
      checkout_ref: ${{ needs.deploy.outputs.checkout_ref }}
    secrets: inherit
