name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install
        run: uv sync --locked --group dev

      - name: Unit tests
        run: uv run --locked --no-sync python -m pytest -v

      - name: Build wheel
        run: uv build --wheel
