name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install
        run: uv sync --locked --group dev

      - name: Offline tests (API, LangGraph workflow, and helpers)
        run: uv run --locked --no-sync python -m pytest -v
