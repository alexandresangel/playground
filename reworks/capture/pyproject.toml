[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diapason-capture"
version = "0.1.0"
description = "LangGraph intelligence-contract extraction service"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["capture", "capture.api", "capture.observability", "capture.workflow", "dia_jwt", "locales"]
py-modules = ["auth_setup", "blob_client", "build_info", "i18n", "mcp_context", "mcp_rpc", "session_store", "settings", "telemetry"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src/capture/common"
"capture" = "src/capture"
"dia_jwt" = "src/capture/common/dia_jwt"
"locales" = "src/capture/common/locales"

[tool.setuptools.package-data]
locales = ["*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
