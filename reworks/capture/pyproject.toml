[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diapason-capture"
version = "0.1.0"
description = "Standalone Diapason contract capture workflow service"
requires-python = ">=3.12"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.26,<2",
  "openai>=1.68,<3",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1",
  "opentelemetry-instrumentation-logging>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "pydantic>=2.10,<3",
  "PyJWT>=2.10,<3",
  "pypdf>=6.16,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

