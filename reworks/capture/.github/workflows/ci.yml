name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.0
      - run: uv sync --locked --extra dev --extra mcp
      - run: uv run --locked --extra dev ruff check src tests scripts
      - run: uv run --locked --extra dev ruff format --check src tests scripts
      - run: uv run --locked --extra dev pytest --junitxml=pytest-report.xml
      - run: uv pip check
      - run: uv build --no-sources
  container:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t capture:test-suite .
      - run: docker build --build-arg GIT_REVISION="$GITHUB_SHA" -t capture:test .
      - run: docker run --rm --network none --mount "type=bind,source=$PWD/scripts,target=/checks,readonly" --entrypoint python capture:test /checks/container_check.py
